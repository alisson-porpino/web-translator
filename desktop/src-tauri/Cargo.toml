[package]
name = "manga-web-translator"
version = "0.1.0"
description = "Local background server + settings UI for the Manga Web Translator browser extension"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
# Only engines/detect.rs still uses this (the Google/Gemini engine's text
# region detector) -- the Koharu engine does its own detection and never
# touches ort.
ort = { version = "2.0.0-rc.14", features = ["download-binaries"] }
# Real-time CPU/RAM usage readout for the resource-usage display (settings
# window + extension popup) -- cross-platform, no per-OS cfg needed unlike
# the memory *limit* above.
sysinfo = "0.39"

# Koharu's actual inference engine (fork: github.com/alisson-porpino/koharu),
# pinned to a fixed rev so the build is reproducible anywhere (incl. CI
# runners) without needing a local clone at a specific path. Bump the rev
# deliberately, not as a side effect of an unrelated change. Replaces this
# crate's own engines/* (detect/OCR/inpaint/translate via onnxruntime+
# llama-cpp-2) -- see specs/DIRETRIZES.md's "Migração em andamento" section
# for why.
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
koharu-pipeline = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-scene = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-ml = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-config = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-translator = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-renderer = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
koharu-rasterizer = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741", features = [
    "native",
] }
koharu-runtime = { git = "https://github.com/alisson-porpino/koharu", rev = "af54817f66b4d5bc225ea0cfbbb5bb5a77ad3741" }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
# For the optional memory cap (resource_limits.rs): setrlimit(RLIMIT_AS, ..)
# on macOS/Linux.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# For the optional memory cap's Windows arm (resource_limits.rs): a Job
# Object's ProcessMemoryLimit, the Windows equivalent of setrlimit above.
# Written and verified against the published 0.62.0 source on GitHub
# (exact signatures/feature gates, not guessed) but never compiled or run
# on real Windows -- this project is developed on macOS. Verify on an
# actual Windows box before relying on it.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# CoreML EP for engines/detect.rs's ONNX session. Cargo unions features
# for the same dependency declared in multiple sections, so this adds
# onto the plain `ort` entry above rather than conflicting with it.
ort = { version = "2.0.0-rc.14", features = ["coreml"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
